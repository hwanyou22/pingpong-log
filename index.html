<title>얼렁뚱땡 탁구단 · PING-PONG LOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --ivory:#F6F1E4;
    --card:#FFFFFF;
    --card-lesson:#DCEEF7;
    --ink:#2B2620;
    --muted:#9A8F7A;
    --line:#E7DEC9;
    --red:#E24B36;
    --red-soft:#FBE2DC;
    --blue:#2F6FB0;
    --blue-soft:#DCEAF7;
    --charcoal:#242220;
    --gold:#C9973D;
    --shadow: 0 8px 20px rgba(60,45,20,0.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    padding:20px 14px 32px;
  }
  .wrap{max-width:440px;margin:0 auto;}

  /* Header */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;padding:0 2px;
  }
  .brand{
    font-family:'Noto Sans KR', sans-serif;
    font-size:18px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);
    display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  }
  .brand .eng{
    font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.02em;
  }
  .brand .ball{
    align-self:center;width:9px;height:9px;border-radius:50%;background:var(--red);
  }

  /* Month nav card */
  .month-card{
    background:var(--card);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .month-nav{display:flex;align-items:center;justify-content:space-between;}
  .month-nav button{
    background:var(--ivory);border:none;color:var(--ink);
    width:32px;height:32px;border-radius:10px;font-size:15px;cursor:pointer;
  }
  .month-title{font-family:'Noto Sans KR', sans-serif;font-size:20px;font-weight:800;text-align:center;letter-spacing:-0.01em;}
  .month-sub{font-family:'Noto Sans KR', sans-serif;font-size:11px;font-weight:500;color:var(--muted);text-align:center;margin-top:1px;}
  .sync-status{
    font-size:10px;color:var(--muted);text-align:center;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:4px;
  }
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#8FBF8A;}
  .sync-dot.syncing{background:var(--gold);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

  .stats{display:flex;gap:8px;margin-top:12px;}
  .stat{
    flex:1;background:var(--ivory);border-radius:12px;padding:8px 12px;
    display:flex;align-items:baseline;gap:5px;
  }
  .stat .num{font-family:'Noto Sans KR', sans-serif;font-size:17px;font-weight:800;}
  .stat.go .num{color:var(--red);}
  .stat.lesson .num{color:var(--charcoal);}
  .stat .lbl{font-size:12.5px;font-weight:600;color:var(--muted);}

  /* Calendar */
  .calendar{
    background:var(--card);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  .weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-bottom:6px;}
  .weekdays span{
    text-align:center;font-size:11px;font-weight:600;color:var(--muted);
    padding-bottom:4px;
  }
  .weekdays span.sat{color:var(--blue);}
  .weekdays span.sun{color:var(--red);}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;}
  .day{
    aspect-ratio:1/1.02;
    min-width:0;
    overflow:hidden;
    background:var(--ivory);
    border-radius:9px;
    padding:4px 3px 3px;
    display:flex;flex-direction:column;
    gap:2px;
    cursor:pointer;
    position:relative;
    border:1.5px solid transparent;
  }
  .day.lessonday{background:var(--card-lesson);}
  .day.empty{background:transparent;cursor:default;}
  .day.today{border-color:var(--charcoal);}
  .daynum{
    font-family:'Noto Sans KR', sans-serif;font-size:11px;font-weight:600;color:var(--ink);
    text-align:center;
  }
  .daynum.sat{color:var(--blue);}
  .daynum.sun,.daynum.holiday{color:var(--red);}
  .holiday-dot{
    position:absolute;top:3px;right:4px;
    width:4px;height:4px;border-radius:50%;background:var(--red);
  }
  .badges{display:flex;flex-direction:row;gap:2px;margin-top:auto;}
  .badge{
    width:calc(50% - 1px);
    height:7px;
    border-radius:2.5px;
  }
  .badge.go{background:var(--red);}
  .badge.lesson{background:var(--charcoal);}

  /* Day picker sheet */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(43,38,32,0.35);
    display:none;align-items:flex-end;justify-content:center;
    z-index:20;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;max-width:440px;
    background:var(--card);
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(60,45,20,0.18);
    animation:slideup .18s ease;
  }
  @keyframes slideup{from{transform:translateY(16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px;}
  .sheet-date{font-size:15px;font-weight:700;margin-bottom:14px;}
  .sheet-options{display:flex;gap:10px;margin-bottom:16px;}
  .sheet-opt{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 8px;
    border-radius:14px;
    border:2px solid var(--line);
    background:var(--ivory);
    cursor:pointer;
    font-weight:700;font-size:13px;color:var(--muted);
  }
  .sheet-opt .icon{font-size:20px;}
  .sheet-opt.active.go{background:var(--red-soft);border-color:var(--red);color:var(--red);}
  .sheet-opt.active.lesson{background:#E6E3E0;border-color:var(--charcoal);color:var(--charcoal);}
  .sheet-opt.active.memo{background:var(--blue-soft);border-color:var(--blue);color:var(--blue);}

  .memo-compose{
    display:none;
    background:var(--ivory);
    border-radius:14px;
    padding:14px;
    margin-bottom:14px;
  }
  .memo-compose.open{display:block;}
  .sheet-close{
    width:100%;padding:13px;border:none;border-radius:12px;
    background:var(--ivory);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;
  }
  /* ---- 운동 일지 ---- */
  :root{
    --eddie:#3B6FA5;
    --eddie-soft:#DCE7F2;
    --sam:#3F8F5F;
    --sam-soft:#DCEFE1;
  }
  .journal-card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    box-shadow:var(--shadow);
    margin-top:14px;
  }
  .journal-title{
    font-size:15px;font-weight:800;margin-bottom:12px;
  }
  .entry{
    display:flex;gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry-bar{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;}
  .entry-bar.eddie{background:var(--eddie);}
  .entry-bar.sam{background:var(--sam);}
  .entry-body{flex:1;min-width:0;}
  .entry-top{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
  .entry-author{font-size:11px;font-weight:700;}
  .entry-author.eddie{color:var(--eddie);}
  .entry-author.sam{color:var(--sam);}
  .entry-date{font-size:10.5px;color:var(--muted);}
  .entry-text{font-size:13px;line-height:1.5;color:var(--ink);margin-bottom:6px;}
  .entry-tag{
    display:inline-block;font-size:10.5px;font-weight:600;
    padding:3px 9px;border-radius:100px;
  }
  .entry-tag.eddie{background:var(--eddie-soft);color:var(--eddie);}
  .entry-tag.sam{background:var(--sam-soft);color:var(--sam);}
  .entry-actions{display:flex;gap:10px;margin-top:6px;}
  .entry-action-btn{
    background:none;border:none;padding:0;
    font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;
  }
  .entry-action-btn.delete{color:var(--red);}
  .entry-edit-form textarea, .entry-edit-form input{
    width:100%;border:1.5px solid var(--line);border-radius:8px;
    padding:8px 10px;font-size:12.5px;font-family:'Noto Sans KR',sans-serif;
    background:#fff;color:var(--ink);margin-bottom:6px;resize:none;
  }
  .entry-edit-actions{display:flex;gap:8px;}
  .entry-edit-actions button{
    flex:1;padding:7px 0;border-radius:8px;border:none;
    font-size:12px;font-weight:700;cursor:pointer;
  }
  .entry-edit-actions .save-btn{background:var(--ink);color:#fff;}
  .entry-edit-actions .cancel-btn{background:var(--card);border:1.5px solid var(--line);color:var(--muted);}

  .journal-more{
    width:100%;margin-top:8px;padding:10px;
    background:var(--ivory);border:none;border-radius:10px;
    font-size:12px;color:var(--muted);font-weight:600;cursor:pointer;
  }

  .journal-add{
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
  }
  .author-select{display:flex;gap:8px;margin-bottom:10px;}
  .author-btn{
    flex:1;padding:9px 0;border-radius:10px;border:2px solid var(--line);
    background:var(--ivory);font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;
  }
  .author-btn.eddie.active{background:var(--eddie-soft);border-color:var(--eddie);color:var(--eddie);}
  .author-btn.sam.active{background:var(--sam-soft);border-color:var(--sam);color:var(--sam);}
  .journal-input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:13px;font-family:'Noto Sans KR',sans-serif;
    background:var(--ivory);color:var(--ink);margin-bottom:8px;resize:none;
  }
  .journal-input:focus{outline:none;border-color:var(--muted);}
  .journal-submit{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--ink);color:#fff;font-weight:700;font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <div class="brand"><span class="ball"></span>얼렁뚱땡 탁구단 <span class="eng">PING-PONG LOG</span></div>
    </div>
  </div>

  <div class="month-card">
    <div class="month-nav">
      <button onclick="prevMonth()">‹</button>
      <div>
        <div class="month-title" id="monthTitle">AUG 2026</div>
        <div class="month-sub" id="monthSub">2026년 8월</div>
      </div>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="sync-status"><span class="sync-dot" id="syncDot"></span><span id="syncText">동기화됨</span></div>
    <div class="stats">
      <div class="stat go">
        <div class="num" id="goCount">0</div>
        <div class="lbl">탁구</div>
      </div>
      <div class="stat lesson">
        <div class="num" id="lessonCount">0</div>
        <div class="lbl">레슨</div>
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="weekdays">
      <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="journal-card">
    <div class="journal-title">얼렁뚱땡 탁구단의 운동 일지</div>
    <div id="journalEntries"></div>
    <button class="journal-more" id="journalMoreBtn" onclick="toggleOlderEntries()">▼ 이전 일지 더 보기 (3개 더)</button>
  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheetOnBackdrop(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-date" id="sheetDate">8월 12일 (수)</div>
    <div class="sheet-options">
      <div class="sheet-opt go" id="optGo" onclick="toggleType('go')">
        <span class="icon">🏓</span>탁구
      </div>
      <div class="sheet-opt lesson" id="optLesson" onclick="toggleType('lesson')">
        <span class="icon">🎓</span>레슨
      </div>
      <div class="sheet-opt memo" id="optMemo" onclick="toggleMemoPanel()">
        <span class="icon">📝</span>메모
      </div>
    </div>

    <div class="memo-compose" id="memoCompose">
      <div class="author-select">
        <button class="author-btn eddie active" id="memoAuthorEddieBtn" onclick="selectMemoAuthor('eddie')">Eddie</button>
        <button class="author-btn sam" id="memoAuthorSamBtn" onclick="selectMemoAuthor('sam')">Samantha</button>
      </div>
      <textarea class="journal-input" id="memoText" rows="2" placeholder="오늘 어땠나요?"></textarea>
      <input class="journal-input" id="memoTag" placeholder="태그 (예: 폼 교정, 스매싱 연습)">
      <button class="journal-submit" onclick="saveMemo()">메모 저장</button>
    </div>

    <button class="sheet-close" onclick="closeSheet()">닫기</button>
  </div>
</div>

<script>
const MONTH_NAMES_EN = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const weekdayNames = ['일','월','화','수','목','금','토'];
// 레슨 가능 요일: 화(2), 목(4), 금(5)
const lessonWeekdays = [2,4,5];

// 2026년 대한민국 공휴일 (관공서의 공휴일에 관한 규정 기준)
const HOLIDAYS = {
  '2026-01-01':'신정', '2026-02-16':'설날 연휴', '2026-02-17':'설날', '2026-02-18':'설날 연휴',
  '2026-03-01':'삼일절', '2026-03-02':'대체공휴일', '2026-05-01':'노동절', '2026-05-05':'어린이날',
  '2026-05-24':'부처님오신날', '2026-05-25':'대체공휴일', '2026-06-06':'현충일', '2026-07-17':'제헌절',
  '2026-08-15':'광복절', '2026-08-17':'대체공휴일', '2026-09-24':'추석 연휴', '2026-09-25':'추석',
  '2026-09-26':'추석 연휴', '2026-10-03':'개천절', '2026-10-05':'대체공휴일', '2026-10-09':'한글날',
  '2026-12-25':'기독탄신일'
};

// ---- Firebase 초기화 ----
const firebaseConfig = {
  apiKey: "AIzaSyD63sUl05atJgNI4IuX46ycGzZnh86nFJ0",
  authDomain: "pingpong-log.firebaseapp.com",
  databaseURL: "https://pingpong-log-default-rtdb.firebaseio.com",
  projectId: "pingpong-log",
  storageBucket: "pingpong-log.firebasestorage.app",
  messagingSenderId: "630175898373",
  appId: "1:630175898373:web:d9bd59ff6746d4cb25756c"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const now = new Date();
let curYear = now.getFullYear();
let curMonth = now.getMonth(); // 0-indexed
const todayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;

let monthData = {}; // { day: ['go','lesson'] }
let selectedDay = null;
let currentRef = null; // 현재 구독 중인 Firebase 경로

const grid = document.getElementById('grid');

function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function monthPath(y,m){ return `pingpong-records/${y}-${pad(m+1)}`; }
function fbDayKey(d){ return 'd' + d; } // 숫자 키가 배열로 변환되는 걸 방지

function setSyncStatus(state){
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  dot.classList.toggle('syncing', state === 'syncing');
  text.textContent = state === 'syncing' ? '연결 중…' : state === 'error' ? '연결 실패 (재시도 중)' : '실시간 연결됨';
}

function attachListener(y, m){
  if(currentRef) currentRef.off();
  setSyncStatus('syncing');
  currentRef = db.ref(monthPath(y, m));
  currentRef.on('value', (snapshot) => {
    const val = snapshot.val() || {};
    monthData = {};
    Object.keys(val).forEach(k => {
      const day = parseInt(k.replace('d', ''), 10);
      if(!isNaN(day)) monthData[day] = val[k];
    });
    setSyncStatus('ok');
    renderCalendarHeader();
    render();
  }, (err) => {
    console.error('연결 실패', err);
    setSyncStatus('error');
  });
}

async function saveMonth(y, m){
  const obj = {};
  Object.keys(monthData).forEach(d => { obj[fbDayKey(d)] = monthData[d]; });
  setSyncStatus('syncing');
  try{
    await db.ref(monthPath(y, m)).set(obj);
    // setSyncStatus('ok')는 리스너가 값을 받으면 자동으로 처리됨
  }catch(err){
    console.error('저장 실패', err);
    setSyncStatus('error');
  }
}

function renderCalendarHeader(){
  document.getElementById('monthTitle').textContent = `${MONTH_NAMES_EN[curMonth]} ${curYear}`;
  document.getElementById('monthSub').textContent = `${curYear}년 ${curMonth+1}월`;
}

function updateStats(){
  let goCount = 0, lessonCount = 0;
  Object.values(monthData).forEach(list=>{
    (list||[]).forEach(type=>{
      if(type==='go') goCount++;
      else if(type==='lesson') lessonCount++;
    });
  });
  document.getElementById('goCount').textContent = goCount;
  document.getElementById('lessonCount').textContent = lessonCount;
}

function render(){
  updateStats();
  grid.innerHTML = '';
  const firstDay = new Date(curYear, curMonth, 1).getDay();
  const lastDate = new Date(curYear, curMonth + 1, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement('div');
    empty.className='day empty';
    grid.appendChild(empty);
  }

  for(let d=1; d<=lastDate; d++){
    const dow = new Date(curYear, curMonth, d).getDay();
    const key = dateKey(curYear, curMonth, d);
    const isHoliday = !!HOLIDAYS[key];
    const isLessonDay = lessonWeekdays.includes(dow);
    const isToday = `${curYear}-${curMonth}-${d}` === todayKey;

    const cell = document.createElement('div');
    cell.className = 'day'
      + (isToday ? ' today':'')
      + (isLessonDay ? ' lessonday':'');
    cell.onclick = () => openSheet(d);

    const num = document.createElement('div');
    let numClass = 'daynum';
    if(isHoliday || dow===0) numClass += ' sun';
    else if(dow===6) numClass += ' sat';
    num.className = numClass;
    num.textContent = d;
    cell.appendChild(num);

    if(isHoliday){
      const dot = document.createElement('div');
      dot.className='holiday-dot';
      cell.appendChild(dot);
    }

    const badgeWrap = document.createElement('div');
    badgeWrap.className='badges';
    (monthData[d]||[]).forEach(type=>{
      const b = document.createElement('div');
      b.className = 'badge ' + (type==='go' ? 'go':'lesson');
      badgeWrap.appendChild(b);
    });
    cell.appendChild(badgeWrap);
    grid.appendChild(cell);
  }
}

// ---- 월 이동 ----
function prevMonth(){
  curMonth--;
  if(curMonth < 0){ curMonth = 11; curYear--; }
  closeSheet();
  attachListener(curYear, curMonth);
}
function nextMonth(){
  curMonth++;
  if(curMonth > 11){ curMonth = 0; curYear++; }
  closeSheet();
  attachListener(curYear, curMonth);
}

// ---- 날짜 선택 시트 ----
function openSheet(d){
  selectedDay = d;
  const dow = new Date(curYear, curMonth, d).getDay();
  document.getElementById('sheetDate').textContent = `${curMonth+1}월 ${d}일 (${weekdayNames[dow]})`;
  updateSheetUI();
  closeMemoPanel();
  document.getElementById('sheetBackdrop').classList.add('open');
}

function closeSheet(){
  document.getElementById('sheetBackdrop').classList.remove('open');
  closeMemoPanel();
  selectedDay = null;
}

function closeSheetOnBackdrop(e){
  if(e.target.id === 'sheetBackdrop') closeSheet();
}

function hasType(d, type){
  return (monthData[d]||[]).includes(type);
}

async function toggleType(type, day = selectedDay){
  if(day === null) return;
  if(!monthData[day]) monthData[day] = [];
  const list = monthData[day];
  const idx = list.indexOf(type);
  if(idx > -1){
    list.splice(idx, 1); // 이미 있으면 꺼서 취소
  } else {
    list.push(type); // 없으면 켜기
  }
  if(list.length === 0) delete monthData[day];
  if(day === selectedDay) updateSheetUI();
  render();
  await saveMonth(curYear, curMonth);
}

function updateSheetUI(){
  document.getElementById('optGo').classList.toggle('active', hasType(selectedDay, 'go'));
  document.getElementById('optLesson').classList.toggle('active', hasType(selectedDay, 'lesson'));
}

// ---- 시트 안의 메모 작성 패널 ----
let memoAuthor = 'eddie';

function toggleMemoPanel(){
  const panel = document.getElementById('memoCompose');
  const isOpen = panel.classList.toggle('open');
  document.getElementById('optMemo').classList.toggle('active', isOpen);
}

function closeMemoPanel(){
  document.getElementById('memoCompose').classList.remove('open');
  document.getElementById('optMemo').classList.remove('active');
  document.getElementById('memoText').value = '';
  document.getElementById('memoTag').value = '';
  selectMemoAuthor('eddie');
}

function selectMemoAuthor(author){
  memoAuthor = author;
  document.getElementById('memoAuthorEddieBtn').classList.toggle('active', author === 'eddie');
  document.getElementById('memoAuthorSamBtn').classList.toggle('active', author === 'sam');
}

async function saveMemo(){
  if(selectedDay === null) return;
  const textEl = document.getElementById('memoText');
  const tagEl = document.getElementById('memoTag');
  const text = textEl.value.trim();
  if(!text) return;

  const dateStr = `${curYear}.${pad(curMonth+1)}.${pad(selectedDay)}`;
  const ts = new Date(curYear, curMonth, selectedDay, 12, 0, 0).getTime();
  const entry = { author: memoAuthor, date: dateStr, text, tag: tagEl.value.trim(), ts };

  try{
    await journalRef.push(entry);
    closeMemoPanel();
    journalShowAll = true; // 방금 쓴 글이 바로 보이도록
  }catch(err){
    console.error('메모 저장 실패', err);
  }
}

// ---- 최초 연결: 이번 달 데이터를 실시간으로 구독 ----
attachListener(curYear, curMonth);

// ---- 운동 일지 (Firebase 실시간 연동) ----
let journalShowAll = false;
let journalData = {}; // { pushId: {author, date, text, tag, ts} }
let editingKey = null;

const journalRef = db.ref('pingpong-journal');
journalRef.on('value', (snapshot) => {
  journalData = snapshot.val() || {};
  renderJournal();
}, (err) => {
  console.error('일지 연결 실패', err);
});

function getSortedEntries(){
  return Object.entries(journalData)
    .map(([key, val]) => ({ key, ...val }))
    .sort((a, b) => (b.ts||0) - (a.ts||0));
}

function renderJournal(){
  const wrap = document.getElementById('journalEntries');
  const entries = getSortedEntries();
  const visibleCount = journalShowAll ? entries.length : Math.min(3, entries.length);
  const hiddenCount = entries.length - visibleCount;

  wrap.innerHTML = '';
  if(entries.length === 0){
    wrap.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:12.5px;padding:14px 0;">아직 기록된 일지가 없어요.</div>`;
  }
  entries.slice(0, visibleCount).forEach(e => {
    const row = document.createElement('div');
    row.className = 'entry';

    if(editingKey === e.key){
      row.innerHTML = `
        <div class="entry-bar ${e.author}"></div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-author ${e.author}">${e.author === 'eddie' ? 'Eddie' : 'Samantha'}</span>
            <span class="entry-date">${e.date}</span>
          </div>
          <div class="entry-edit-form">
            <textarea rows="2" id="editText-${e.key}">${escapeHtml(e.text)}</textarea>
            <input id="editTag-${e.key}" value="${escapeHtml(e.tag||'')}" placeholder="태그">
            <div class="entry-edit-actions">
              <button class="save-btn" onclick="saveEditEntry('${e.key}')">저장</button>
              <button class="cancel-btn" onclick="cancelEditEntry()">취소</button>
            </div>
          </div>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="entry-bar ${e.author}"></div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="entry-author ${e.author}">${e.author === 'eddie' ? 'Eddie' : 'Samantha'}</span>
            <span class="entry-date">${e.date}</span>
          </div>
          <div class="entry-text">${escapeHtml(e.text)}</div>
          ${e.tag ? `<span class="entry-tag ${e.author}">${escapeHtml(e.tag)}</span>` : ''}
          <div class="entry-actions">
            <button class="entry-action-btn" onclick="startEditEntry('${e.key}')">수정</button>
            <button class="entry-action-btn delete" onclick="deleteEntry('${e.key}')">삭제</button>
          </div>
        </div>`;
    }
    wrap.appendChild(row);
  });

  const moreBtn = document.getElementById('journalMoreBtn');
  if(hiddenCount > 0){
    moreBtn.style.display = 'block';
    moreBtn.textContent = journalShowAll ? '▲ 접기' : `▼ 이전 일지 더 보기 (${hiddenCount}개 더)`;
  } else {
    moreBtn.style.display = 'none';
  }
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleOlderEntries(){
  journalShowAll = !journalShowAll;
  renderJournal();
}

function startEditEntry(key){
  editingKey = key;
  renderJournal();
}

function cancelEditEntry(){
  editingKey = null;
  renderJournal();
}

async function saveEditEntry(key){
  const textEl = document.getElementById(`editText-${key}`);
  const tagEl = document.getElementById(`editTag-${key}`);
  const text = textEl.value.trim();
  if(!text) return;
  try{
    await journalRef.child(key).update({ text, tag: tagEl.value.trim() });
    editingKey = null;
    // 실제 반영은 on('value') 리스너가 처리
  }catch(err){
    console.error('일지 수정 실패', err);
  }
}

async function deleteEntry(key){
  if(!confirm('이 일지를 삭제할까요?')) return;
  try{
    await journalRef.child(key).remove();
  }catch(err){
    console.error('일지 삭제 실패', err);
  }
}
</script>
</body>
</html>
